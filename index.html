          <section data-markdown>
            <script type="text/template">
              ### a) Recht (CH): _Bund_

              **Behindertengleichstellungsgesetz BehiG**: Dienstleistungen des Gemeinwesens müssen auch für Menschen mit Behinderungen zugänglich sein

              **Behindertengleichstellungsverordnung**: Internetangebote des Bundes müssen so gestaltet sein, dass Menschen mit Behinderungen diese barrierefrei nutzen können
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### a) Recht (CH): _Kantone und Gemeinden_

              > In praktisch allen Kantonen fehlen konkrete Richtlinien und Standards für die Umsetzung des BehiG im Bereich Accessibility. Durch das Fehlen kantonaler Richtlinien herrscht in den Gemeinden eine grosse Unsicherheit.»
              >

            <script type="text/template">
              ## 2. Wann ist eine Webseite barrierefrei?
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Definition der W3C

              > Web accessibility means that websites, tools, and technologies are designed and developed so that **people with disabilities can use them**. More specifically, people can:
              > - perceive, understand, navigate, and interact with the Web
              > - contribute to the Web
              >
              > Web accessibility encompasses all disabilities that affect access to the Web, including: **auditory, cognitive, neurological, physical, speech, visual**
              >
              > <cite>[W3C WAI](https://www.w3.org/WAI/fundamentals/accessibility-intro/)</cite>

              <aside class="notes">
                Hörbehinderungen, kognitive Behinderungen, neurologische Erkrankungen, körperliche Behinderungen,
                Sprachbehinderungen und Sehbehinderungen.
              </aside>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Beispielhafte Fragen

              Kann meine Applikation oder Webseite
              - **ohne Maus** bedient werden?
              - bei **eingeschränkter Seh-/Hörfähigkeit** genutzt werden?
              - von einem **Screenreader** verstanden werden?
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Formale Vorgaben: WCAG

              - WCAG: Web Content Accessibility Guidelines
              - [W3C Recommendation](https://www.w3.org/TR/WCAG/)

              > Following these guidelines will make content more **accessible to a wider range of people with disabilities**, including accommodations for blindness and low vision, deafness and hearing loss, limited movement, speech disabilities, photosensitivity, and combinations of these, and some accommodation for learning disabilities and cognitive limitations; but will not address every user need for people with these disabilities. [...] Following these guidelines will also often make Web content **more usable to users in general**.
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Wie die WCAG strukturiert sind

              - 4 **Principles** (Prinzipien)

                - perceivable (wahrnehmbar)
                - operable (bedienbar)
                - understandable (verständlich)
                - robust

              - 13 **Guidelines** (Richtlinien)
              - Testbare **Success Criteria** (Erfolgskriterien) für jede Richtlinie
              - 3 **Levels of Conformance** (Konformitätsstufen) für Erfolgskriterien: A (tiefstes), AA, AAA (höchstes)
              - **Sufficient and Advisory Techniques** (ausreichende und empfohlene Techniken) zur Erfüllung eines Kriteriums
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### WCAG-Beispiel: Labels in Formularen

              Beispiel eines Erfolgskriteriums im Zusammenhang mit Formularen:

              - [**Principle** 3: Understandable](https://www.w3.org/TR/WCAG22/#understandable): Information and the operation of user interface must be understandable.
                - [**Guideline** 3.3 Input Assistance](https://www.w3.org/TR/WCAG22/#input-assistance): Help users avoid and correct mistakes.
                  - [**Success Criterion** 3.3.2 Labels or Instructions](https://www.w3.org/TR/WCAG22/#labels-or-instructions): Labels or instructions are provided when content requires user input. (Level A)
                    - [**Sufficient Techniques** for 3.3.2 - Labels or Instructions](https://www.w3.org/WAI/WCAG22/quickref/?showtechniques=332#labels-or-instructions)
                      - [G131: Providing descriptive labels](https://www.w3.org/WAI/WCAG22/Techniques/general/G131.html)
                      - [H90: Indicating required form controls using label or legend](https://www.w3.org/WAI/WCAG22/Techniques/html/H90.html)
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### WCAG-Beispiel: Visuelle Aspekte

              Wichtige WCAG-Richtlinie: «[1.4 Distinguishable](https://www.w3.org/WAI/WCAG22/quickref/#distinguishable): Make it easier for users to see and hear content including separating foreground from background.»

              Kriterien (Auswahl):
              - [1.4.1 Use of Color](https://www.w3.org/WAI/WCAG22/quickref/?showtechniques=141#distinguishable): **Color is not used as the only visual means** of conveying information, indicating an action, prompting a response, or distinguishing a visual element. (Level A):
                - [G183](https://www.w3.org/WAI/WCAG22/Techniques/general/G183.html): Using a contrast ratio of 3:1 with surrounding text […] for links or controls where color alone is used to identify them
              - [1.4.3 Contrast (Minimum)](https://www.w3.org/WAI/WCAG22/quickref/?showtechniques=143#contrast-minimum): The visual presentation of text and images of text has a **contrast ratio of at least 4.5:1**, except for the following: … (Level AA)
              - [2.5.8 Target Size (Minimum)](https://www.w3.org/WAI/WCAG22/quickref/?showtechniques=258#target-size-minimum): The size of the target for pointer inputs is **at least 24 by 24 CSS pixels**, except where: … (Level AA)
            </script>
          </section>

              ## 3. Wie barrierefrei ist das Web?
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Weltweit: 👎

              Auszug aus [Auswertung des HTTP Archive für 2025](https://almanac.httparchive.org/en/2025/accessibility) (16 Mio Webseiten):

              ![Almanac Logo](media/http-archive.png)

              <!-- .element class="custom-right" -->

              - **2/3** der Seiten haben **ungenügenden Farbkontrast**.
              - **1/5** der Seiten versucht, Zooming auf Mobile zu deaktivieren.
              - **1/3** der Bilder haben **keinen Alternativtext**.
              - **2/3** der Seiten haben **Formularfelder ohne Labels**.
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### In der Schweiz: 👎 (1)

              Auszug aus [Pilotstudie 2026: Barrierefreiheit digitaler Angebote in der Schweiz](https://berichte.studien.adis.ch/reports/b6db70e5-ac9a-4b00-a180-b6261ca71141/v1/de/study.html):

              - Manuelle Prüfung Web: **23 von 25** Webangeboten sind nach der Gesamtbewertung **nicht ausreichend zugänglich**. Bei allen 25 wurde mindestens ein Mangel beobachtet.
              - Automatisierte Prüfung Web: **89 von 94** Webangeboten mit ausgewähltem automatisiertem Ergebnis weisen **mindestens einen gemeldeten Verstoss auf**. Die Prüfung deckt nur maschinell prüfbare Anforderungen ab.
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### In der Schweiz: 👎 (2)

              Auszug aus [Schweizer Accessibility-Studie Onlineshops (2020)](https://access-for-all.ch/publikationen/accessibility-studie/accessibility-studie-2020/):

              - **Hilfestellung** bei Interaktionen: 36 von 41 Shops sind in diesem Bereich ungenügend.
              - Alle 11 Onlineshops, die [..] **Multimediainhalte** [wie Videos] einsetzen, erfüllen diese Anforderungen in keiner Weise.
              - Mehr als die Hälfte der getesteten Onlineshops weist Verbesserungsbedarf im Bereich **Nicht-Textinhalte** auf.
              - 20 Onlineshops, die nur 1 von 5 möglichen Punkten im Bereich **Syntax/Kompatibilität** erzielen.
              - Die **Tastaturbedienbarkeit** lässt in vielen Onlineshops ebenfalls zu wünschen übrig.
            </script>
          </section>
        </section>

              ### Browser Dev Tools: Accessibility Inspector

              Informationen, welche der Browser unterstützenden Technologien wie Screenreadern zur Verfügung stellt.

              - Hat er eine **[semantisch](https://developer.mozilla.org/en-US/docs/Glossary/Semantics) korrekte Struktur**?
              - Haben meine Elemente **semantisch korrekte Rollen**?
            </script>

              ## 5. Was sind typische Probleme? Wie löst man sie?
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### a) Man arbeitet gegen den Browser (1)

              #### Problem

              Native, barrierefreie Lösungen wie **Focus Outlines** werden manuell entfernt.

              #### Folge

              Nur User:innern mit einer Maus können [ein Element zuverlässig finden](https://cas-fe.github.io/Accessibility/demos/visual/focus-styles-inaccessible.html).

              <div class="fragment">

              #### Lösung

              - Verwendung von [`:not(:focus-visible)`](https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible) beim Entfernen von `outline`.

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### b) Man arbeitet gegen den Browser (2)

              #### Problem

              Elemente wie **Buttons** werden selber umgesetzt, statt native Elemente zu verwenden.

              #### Folge

              Nur User:innern mit einer Maus können [eine Aktion auslösen](https://cas-fe.github.io/Accessibility/demos/aria/button-inaccessible.html).

              <div class="fragment">

              #### Lösung

              - Verwendung von [`button`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/button) für Buttons. 🤷‍♂️

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### c) Semantische Struktur fehlt (1)

              #### Problem

              **Seitenstruktur** kommuniziert keine Hierarchie.

              #### Folgen

              - Screenreader kann die wichtigen Inhalte [nicht finden](https://cas-fe.github.io/Accessibility/demos/structure/structure-inaccessible.html).
              - Suchmaschine kann sie nicht priorisieren.

              <div class="fragment">

              #### Lösung

              - Verwendung von [semantischen](https://developer.mozilla.org/en-US/docs/Glossary/Semantics) Gruppierungselementen wie `main`, `aside`
              - Konsistente Hierarchie von Überschriften: `h1` → `h2` → `h3`

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### d) Semantische Struktur fehlt (2)

              #### Problem

              **Tabelle** kommuniziert nur beschränkte Semantik.

              #### Folge

              Screenreader kann Tabelle [nicht navigieren](https://cas-fe.github.io/Accessibility/demos/table/table-inaccessible.html).

              <div class="fragment">

              #### Lösung

              - Verwendung von [`scope`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/th#scope)-Attribut
              - Verwendung von [`caption`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/caption)

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### e) Text-Alternative fehlt

              #### Problem

              **Visuelle Inhalte** haben keine begleitende Text-Alternative.

              #### Folge

              Screenreader-User:innen können Inhalte [nicht verstehen](https://cas-fe.github.io/Accessibility/demos/images/images-inaccessible.html).

              <div class="fragment">

              #### Lösung

              - Verwendung von visuell versteckten Alternativ-Texten
              - Verstecken rein visueller Elemente vor Screenreader

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### f) Interaktive Elemente kommunizieren keine Zustandsänderung (1)

              #### Problem

              - **Formularvalidierung** wird nicht kommuniziert.
              - Es werden **nicht-native Formularelemente** verwendet.

              #### Folge

              Screenreader kann Formular [nicht korrekt ausfüllen](https://cas-fe.github.io/Accessibility/demos/form/form-inaccessible.html).

              <div class="fragment">

              #### Lösung

              - Verwendung von [nativen Formularelementen](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/select).
              - Verwendung von [nativer Validierung](https://developer.mozilla.org/en-US/docs/Learn/Forms/Form_validation#using_built-in_form_validation) oder eigener [Custom-Validierung](https://cas-fe.github.io/Accessibility/demos/form/form-aria.html) mit ARIA-Attributen.

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### _Einschub:_ ARIA

              [![ARIA-Artikel im Accessibility Developer Guide](media/aria.png)](https://www.accessibility-developer-guide.com/knowledge/aria/) <!-- .element class="custom-right" -->

              - Web Accessibility Initiative: **Accessible Rich Internet Applications**
              - [W3C Recommendation](https://www.w3.org/TR/wai-aria/)
              - Ziel: Inhalte (insbesondere dynamische) zugänglich machen, welche standardmässig nicht zugänglich sind
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### _Einschub:_ ARIA (2)

              - Spezielle **Attribute** im Markup
              - Beeinflussen nur, welche Informationen via **Accessibility-API des Browsers** zur Verfügung gestellt werden
              - «Attaching a role gives assistive technologies information about how to handle each element.»
              - Gewisse Elemente haben **implizite Rollen**:
                - Beispiel: `<nav>` hat implizit die ARIA-Rolle `navigation`
                - Sollte je nach Browser-Support trotzdem explizit hinzugefügt werden (für ältere Browser, welche `<nav>` nicht nativ unterstützen)
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### g) Interaktive Elemente kommunizieren keine Zustandsänderung (2)

              #### Problem

              Zustand von **Custom-Dropdown** wird nicht kommuniziert.

              #### Folge

              Screenreader [findet aufgeklappte Inhalte nicht](https://www.zuerich.com/de).

              <div class="fragment">

              #### Lösung

              - Verwendung von `aria-expanded` für Kommunikation des Zustandes.
              - Platzierung des aufgeklappten Inhalts gleich nach `button`.

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### h) Interaktive Elemente werden selber gebastelt

              #### Problem

              Komplexe Komponenten wie **Dialoge** werden selber umgesetzt, statt native Elemente zu verwenden.

              #### Folge

              Screenreader findet Dialog nicht und/oder kann ihn [versehentlich verlassen](https://cas-fe.github.io/Accessibility/demos/aria/modal-inaccessible.html).

              <div class="fragment">

              #### Lösung

              - Verwendung von [`dialog`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/dialog).

              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### _Einschub:_ Vielversprechende APIs

              #### Verfügbar

              - [Constraint Validation API](https://developer.mozilla.org/en-US/docs/Learn/Forms/Form_validation#the_constraint_validation_api): Erweitert die native Formular-Validierung.
              - [CSS scroll snap](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_scroll_snap): Ersetzt in Kombination mit [`IntersectionObserver`](https://developer.mozilla.org/en-US/docs/Web/API/IntersectionObserver) ein Custom-Carousel.
              - [Popover API](https://developer.mozilla.org/en-US/docs/Web/API/Popover_API): Ersetzt Custom-Tooltips/Overlays. [Spannend](https://hidde.blog/positioning-anchored-popovers/) in Kombination mit [CSS Anchor Positioning](https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Anchor_positioning). [Demo Language Switcher](https://codepen.io/backflip/pen/OPPEJpe)
              - [Invoker Commands API](https://developer.mozilla.org/en-US/docs/Web/API/Invoker_Commands_API): Ermöglicht Öffnen von Dialogen _ohne JavaScript_.

              #### In Diskussion

              - [focusgroup](https://developer.chrome.com/blog/focusgroup-rfc): Ersetzt "Roving Tabindex"-Implementationen in JavaScript.
            </script>
          </section>
        </section>

        <section>
          <section data-markdown>
            <script type="text/template">
              ## 6. Wie mache ich barrierefreie Projekte?
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Lerne die Plattform

              - Zeit, welche wir in das Lernen der Plattform investieren, ist **nachhaltig** investiert.
              - Libraries und Frameworks sind kurzlebig und plattform-nativen Lösungen **immer unterlegen**.
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Starte zu Beginn des Projekts

              - Barrierefreiheit wird oft [auf einen späteren Zeitpunkt verschoben](https://www.adnovum.com/de/blog/digitale-baustellen-vermeiden-dank-barrierefreiheit). Selten mit Erfolg.
              - Barrierefreiheit ist grundsätzlich eine **funktionale Anforderung**.
              - Nichtberücksichtigung bedeutet, dass bis zu [1/5](/#/3/7) der Besucher die Webseite oder Applikation nicht korrekt nutzen können. Und **kann gegen das Gesetz verstossen**.
              - Erfolgreiche Projekte berücksichtigen Barrierefreiheit von Beginn weg.
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              ### Schaffe gute Voraussetzungen

              - **Awareness**, insbesondere in der Führung.
              - **Knowhow**, sowohl bei UX-/Frontend-Spezialisten als auch Tester:innen. Bei Bedarf Integration externer Consultants in Projektteam.
              - Barrierefreiheit als **Akzeptanzkriterium** für jedes Feature.
            </script>
          </section>
        </section>
